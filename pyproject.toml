[project]
name = "src"
version = "0.0.0"
description = ""
authors = [{ name = "Viktor Todosijevic", email = "todosijevicviktor998@gmail.com" }]
requires-python = ">=3.13,<3.14"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "hydra-core>=1.3.2,<2",
    "numpy>=2.0",
    "matplotlib==3.9",
    "gekko>=1.3.0,<2",
    "pandapower>=3.1.2,<4",
    "pypower>=5.1.19,<6",
    "grid2op>=1.12.1,<2",
    "sympy>=1.14.0,<2",
    "numba>=0.62.1,<0.63",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0,<8",
    "pylint>=3.0.3,<4",
    "black>=23.12.1,<24",
    "isort>=5.13.2,<6",
    "bump-my-version>=0.16.2,<0.17",
    "flynt>=1.0.1,<2",
    "flake8>=7.0.0,<8",
    "pre-commit>=3.7.0,<4",
    "flake8-pyproject>=1.2.3,<2",
    "docformatter[tomli]>=1.7.5,<2",
    "nox>=2024.4.15,<2025",
    "mccabe>=0.7.0,<0.8",
]
lab = [
    "jupyterlab>=4.0.10,<5",
    "notebook>=7.0.6,<8",
    "jupyterlab-lsp>=5.0.1,<6",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

#
# Tools
#

[tool.bumpversion]
current_version = "0.0.0"
commit = true
message = "Version {new_version} released."
tag = true
tag_name = "{new_version}"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+) (?P<releaseTime>.*)?'
serialize = [
    "{major}.{minor}.{patch}",
    "{utcnow:%Y-%m-%dT%H:%M:%SZ}"
]

[[tool.bumpversion.files]]
filename = "CHANGES.md"
search = '''
[Unreleased](<REPOSITORY_URL>/tree/main) (latest)
-------------------------------------------------------------------------------------
'''
replace = '''
[Unreleased](<REPOSITORY_URL>/tree/main) (latest)
-------------------------------------------------------------------------------------

[//]: # (New changes here in list form)

[{new_version}](<REPOSITORY_URL>/tree/{new_version}) ({utcnow:%Y-%m-%d})
-------------------------------------------------------------------------------------
'''

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "Makefile.variables"
search = "APP_VERSION := {current_version}"
replace = "APP_VERSION := {new_version}"

[tool.pylint]
disable = "C0114,C0115,C0116,R0903,R1710,W1203"
max-line-length = 120
max-locals = 20
max-args = 16
max-attributes = 20
ignore = [
    ".git",
    "migrations",
    "__pycache__"
]

[tool.flake8]
max-line-length = 120
ignore = ["E203", "E266", "E501", "W503"]
docstring-convention = "numpy"
max-complexity = 20
per-file-ignores = []
exclude = [
    ".git",
    "migrations",
    "__pycache__"
]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.flynt]
line-length = 120
transform-concats = true
verbose = true

[tool.docformatter]
style = "numpy"
pre-summary-newline = true
wrap-descriptions = 120
wrap-summaries = 120
blank = false
exclude = []
recursive = true

[tool.uv]
override-dependencies = [
  "matplotlib>=3.10"
]
